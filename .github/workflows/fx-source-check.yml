name: Check ECB FX source

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1-5'

jobs:
  check-fx-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r apps/api/requirements.txt
      - run: python apps/api/scripts/check_fx_source.py
        env:
          PYTHONPATH: apps/api
