# Include this file inside the public HTTPS server block until a licensed,
# access-controlled market data service is available.
# The three routes below can fetch or return provider-derived market data.
location ~ ^/api/v1/(instruments/|market-risk/|combined-analyses(?:/|$)) {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Request-ID "$request_id" always;
    return 503 '{"error":{"code":"MARKET_DATA_UNAVAILABLE","message":"공개 운영 API에서 종목 데이터 제공이 중지되었습니다.","field_errors":[],"request_id":"$request_id"}}';
}
